user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ────────────────────────────────────────────────────────────────
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    # ── Performance ────────────────────────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    # Never expose the nginx version in error pages or headers (OWASP A05)
    server_tokens   off;

    # ── Request size limits (OWASP A04 — prevent oversized payloads) ──────────
    client_max_body_size     2m;
    client_body_timeout      12s;
    client_header_timeout    12s;
    send_timeout             10s;

    # ── Rate limiting zones (OWASP A04 — DoS / brute-force mitigation) ────────
    # general: covers all pages — 30 req/s per IP with burst headroom
    limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
    # api: tighter limit for data-mutating API routes — 10 req/s per IP
    limit_req_zone $binary_remote_addr zone=api:10m     rate=10r/s;
    # auth: very tight for login / signout — 5 req/min per IP
    limit_req_zone $binary_remote_addr zone=auth:10m    rate=5r/m;

    # Return 429 (Too Many Requests) instead of 503 on rate-limit
    limit_req_status  429;

    # ── Gzip compression ───────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_buffers      16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # ── Upstream ───────────────────────────────────────────────────────────────
    upstream web {
        server web:3000;
        keepalive 32;
    }

    # ── Server block ───────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # ── Security headers (OWASP A05 — Security Misconfiguration) ──────────

        # Prevent MIME-type sniffing
        add_header X-Content-Type-Options  "nosniff"    always;

        # Block framing from external origins (clickjacking defence)
        add_header X-Frame-Options         "DENY"       always;

        # Referrer information limited to same origin only
        add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

        # HSTS — force HTTPS for 1 year (ngrok already terminates TLS)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Restrict browser feature access (OWASP A05)
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;

        # Content Security Policy (OWASP A03 — XSS mitigation)
        # 'unsafe-inline' is required by Next.js for inline style/script chunks.
        # 'unsafe-eval' is required by some Next.js internals in production.
        # connect-src covers Supabase realtime WS + REST and OpenRouter LLM gateway.
        # Must be a single line — nginx does not support backslash line continuation in add_header values.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://openrouter.ai; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

        # ── Auth endpoints — very tight rate limit ─────────────────────────────
        location /api/auth/ {
            limit_req zone=auth burst=10 nodelay;

            proxy_pass http://web;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade    $http_upgrade;
            proxy_set_header    Connection "upgrade";
            proxy_connect_timeout  60s;
            proxy_send_timeout     60s;
            proxy_read_timeout     60s;
        }

        # ── API routes — standard rate limit ──────────────────────────────────
        location /api/ {
            limit_req zone=api burst=30 nodelay;

            proxy_pass http://web;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade    $http_upgrade;
            proxy_set_header    Connection "upgrade";
            # Generous timeout for AI streaming responses
            proxy_connect_timeout  60s;
            proxy_send_timeout     300s;
            proxy_read_timeout     300s;
            proxy_buffering       off;
            proxy_cache           off;
        }

        # ── Next.js static assets — GET/HEAD only, long cache ─────────────────
        location /_next/static/ {
            limit_except GET HEAD { deny all; }

            proxy_pass http://web;
            proxy_cache_valid 200 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
            proxy_set_header Host $host;
        }

        # ── Public folder static files — GET/HEAD only ─────────────────────────
        location /public/ {
            limit_except GET HEAD { deny all; }

            proxy_pass http://web;
            add_header Cache-Control "public, max-age=86400";
            proxy_set_header Host $host;
        }

        # ── Everything else — general rate limit ──────────────────────────────
        location / {
            limit_req zone=general burst=50 nodelay;

            proxy_pass http://web;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support (required for Next.js HMR and streaming responses)
            proxy_http_version  1.1;
            proxy_set_header    Upgrade    $http_upgrade;
            proxy_set_header    Connection "upgrade";

            # Generous timeouts for AI streaming responses
            proxy_connect_timeout  60s;
            proxy_send_timeout     300s;
            proxy_read_timeout     300s;

            # Disable buffering for Server-Sent Events / AI responses
            proxy_buffering       off;
            proxy_cache           off;
        }
    }
}