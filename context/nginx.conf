user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ────────────────────────────────────────────────────────────────
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    # ── Performance ────────────────────────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens   off;

    # ── Request size limits (OWASP A04) ───────────────────────────────────────
    client_max_body_size     10m;
    client_body_timeout      12s;
    client_header_timeout    12s;
    send_timeout             10s;

    # ── Rate limiting zones (OWASP A04) ───────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=api:10m     rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m    rate=5r/m;
    limit_req_status  429;

    # ── Gzip compression ───────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_buffers      16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # ── Upstreams ──────────────────────────────────────────────────────────────
    # 10x-builders Next.js app (agent LLM)
    upstream web {
        server web:3000;
        keepalive 32;
    }

    # Expense Control: React SPA (nginx:alpine, port 80)
    upstream expense_app {
        server expense-app:80;
        keepalive 16;
    }

    # Expense Control: NestJS REST API (port 3000)
    upstream expense_api {
        server expense-api:3000;
        keepalive 16;
    }

    # ── Unified server block ────────────────────────────────────────────────────
    # Escucha en puerto 80 (ngrok inbound) y 3000 (LAN directo / host mapping).
    # Todas las rutas — 10x-builders + expense-control — se resuelven aquí.
    server {
        listen 80;
        listen 3000;
        server_name _;

        # ── Security headers (OWASP A05) ──────────────────────────────────────
        add_header X-Content-Type-Options  "nosniff"    always;
        add_header X-Frame-Options         "DENY"       always;
        add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
        # connect-src: cubre Supabase WS/REST, OpenRouter LLM, ngrok (wildcard) y LAN.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://openrouter.ai https://*.ngrok-free.app https://*.ngrok.io; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

        # ══════════════════════════════════════════════════════════════════════
        # EXPENSE CONTROL ROUTES
        # ══════════════════════════════════════════════════════════════════════

        # ── Expense API auth — rate limit muy estricto ────────────────────────
        location /expense-api/auth/ {
            limit_req zone=auth burst=10 nodelay;

            rewrite ^/expense-api/(.*)$ /$1 break;
            proxy_pass http://expense_api;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version  1.1;
            proxy_set_header    Connection "";
            proxy_connect_timeout  60s;
            proxy_send_timeout     60s;
            proxy_read_timeout     60s;
        }

        # ── Expense API REST — rate limit estándar ────────────────────────────
        location /expense-api/ {
            limit_req zone=api burst=30 nodelay;

            rewrite ^/expense-api/(.*)$ /$1 break;
            proxy_pass http://expense_api;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version  1.1;
            proxy_set_header    Connection "";
            proxy_connect_timeout  60s;
            proxy_send_timeout     300s;
            proxy_read_timeout     300s;
            proxy_buffering        off;
            proxy_cache            off;
        }

        # ── Expense assets estáticos — caché larga ────────────────────────────
        # proxy_pass con /assets/ hace path stripping:
        #   /expense/assets/index.js  →  expense_app:/assets/index.js
        location /expense/assets/ {
            limit_except GET HEAD { deny all; }

            proxy_pass http://expense_app/assets/;
            proxy_set_header Host $host;
            proxy_http_version  1.1;
            proxy_set_header    Connection "";
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # ── Expense frontend SPA — rate limit general ─────────────────────────
        # index.html nunca se cachea: el navegador siempre lo pide al servidor.
        # Los assets sí se cachean (bloque /expense/assets/ con immutable).
        # Esto garantiza que tras cada deploy el nuevo JS se carga sin hard-refresh.
        location /expense/ {
            limit_req zone=general burst=50 nodelay;

            proxy_pass http://expense_app/;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version  1.1;
            proxy_set_header    Connection "";
            proxy_connect_timeout  60s;
            proxy_send_timeout     60s;
            proxy_read_timeout     60s;

            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma        "no-cache"                            always;
            add_header Expires       "0"                                   always;
        }

        # ══════════════════════════════════════════════════════════════════════
        # 10X-BUILDERS / AGENT ROUTES
        # ══════════════════════════════════════════════════════════════════════

        # ── Agente LLM / Next.js — acepta /agent y /agent/* ──────────────────
        location /agent {
            limit_req zone=general burst=50 nodelay;

            proxy_pass http://web;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade    $http_upgrade;
            proxy_set_header    Connection "upgrade";
            proxy_connect_timeout  60s;
            proxy_send_timeout     300s;
            proxy_read_timeout     300s;
            proxy_buffering        off;
            proxy_cache            off;
        }

        # ── 10x-builders auth — rate limit muy estricto ───────────────────────
        location /api/auth/ {
            limit_req zone=auth burst=10 nodelay;

            proxy_pass http://web;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade    $http_upgrade;
            proxy_set_header    Connection "upgrade";
            proxy_connect_timeout  60s;
            proxy_send_timeout     60s;
            proxy_read_timeout     60s;
        }

        # ── 10x-builders API routes — streaming y AI ──────────────────────────
        location /api/ {
            limit_req zone=api burst=30 nodelay;

            proxy_pass http://web;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade    $http_upgrade;
            proxy_set_header    Connection "upgrade";
            proxy_connect_timeout  60s;
            proxy_send_timeout     300s;
            proxy_read_timeout     300s;
            proxy_buffering       off;
            proxy_cache           off;
        }

        # ── Next.js static assets — GET/HEAD only, caché larga ────────────────
        location /_next/static/ {
            limit_except GET HEAD { deny all; }

            proxy_pass http://web;
            proxy_cache_valid 200 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
            proxy_set_header Host $host;
        }

        # ── Public folder — GET/HEAD only ─────────────────────────────────────
        location /public/ {
            limit_except GET HEAD { deny all; }

            proxy_pass http://web;
            add_header Cache-Control "public, max-age=86400";
            proxy_set_header Host $host;
        }

        # ── Root → redirige a /expense/ ───────────────────────────────────────
        location = / {
            return 301 /expense/;
        }

        # ── Todo lo demás → 10x-builders web (Next.js) ───────────────────────
        location / {
            limit_req zone=general burst=50 nodelay;

            proxy_pass http://web;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade    $http_upgrade;
            proxy_set_header    Connection "upgrade";
            proxy_connect_timeout  60s;
            proxy_send_timeout     300s;
            proxy_read_timeout     300s;
            proxy_buffering       off;
            proxy_cache           off;
        }
    }
}
