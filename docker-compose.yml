# Full stack — BD + API + App en un solo compose.
#
# Uso en desarrollo local:
#   docker compose up -d
#
# Uso en producción (build incluido):
#   docker compose up -d --build
#
# Para resetear la BD limpia:
#   docker compose down -v && docker compose up -d

services:
  expense-db:
    image: postgres:17
    container_name: expense_control_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: expense_control
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - expense_db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d expense_control']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - expense_network

  expense-api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: expense-control/api:latest
    container_name: expense_control_api
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@expense-db:5432/expense_control
    depends_on:
      expense-db:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - expense_network

  expense-app:
    build:
      context: ./app
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://192.168.1.212:3000/expense-api}
        VITE_BASE: /expense/
    image: expense-control/app:latest
    container_name: expense_control_app
    restart: unless-stopped
    depends_on:
      - expense-api
    networks:
      - expense_network

volumes:
  expense_db_data:
    name: expense_db_data

networks:
  expense_network:
    name: expense_network
    driver: bridge
