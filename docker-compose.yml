services:
  postgres:
    image: postgres:17
    container_name: expense_control_db
    environment:
      POSTGRES_DB: expense_control
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d expense_control']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
