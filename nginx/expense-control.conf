# ── Expense Control Assistant — nginx include ──────────────────────────────────
#
# Este archivo se copia al servidor en:
#   /etc/nginx/conf.d/expense-control.conf
# (dentro del contenedor 10x-builders-nginx)
#
# Para activarlo, agrega UNA línea al final del bloque http {} en nginx.conf:
#   include /etc/nginx/conf.d/*.conf;
#
# Las zonas de rate limit (general, api, auth) ya están definidas en nginx.conf.
# Este archivo las reutiliza sin redefinirlas.
#
# Upstreams:
#   expense_app        → contenedor nginx:alpine sirviendo el build de React (:80)
#                        alias: expense-app (registrado en expense_network)
#   expense_api        → contenedor NestJS (:3000)
#                        alias: expense-api (registrado en expense_network)
#   10x_builders_web   → contenedor Next.js / agente LLM (:3000)
#                        alias: web (registrado en 10x-builders_internal)
#
# Redes requeridas en 10x-builders-nginx:
#   - 10x-builders_internal  (para alcanzar web:3000)
#   - expense_network         (para alcanzar expense-app:80 y expense-api:3000)
# ──────────────────────────────────────────────────────────────────────────────

upstream expense_app {
    server expense-app:80;
    keepalive 16;
}

upstream expense_api {
    server expense-api:3000;
    keepalive 16;
}

upstream 10x_builders_web {
    server web:3000;
    keepalive 16;
}

# ── Servidor Expense Control — Puerto 3000 ─────────────────────────────────────
# Todo el tráfico público entra por ngrok → nginx:3000 y se enruta por context path.
#
#   /expense/        → React SPA (expense-app)
#   /expense-api/    → NestJS REST API (expense-api)
#   /agent           → Next.js / LLM agent (10x-builders-web)
#
server {
    listen 3000;
    server_name _;

    add_header X-Content-Type-Options  "nosniff"                          always;
    add_header X-Frame-Options         "DENY"                             always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin"  always;
    add_header Permissions-Policy      "camera=(), microphone=(), geolocation=(), payment=()" always;
    # connect-src incluye el dominio ngrok (wildcard) para que el frontend React
    # y el agente puedan hacer fetch a través del túnel HTTPS.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://*.ngrok-free.app https://*.ngrok.io; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

    # ── Auth — rate limit muy estricto ───────────────────────────────────────
    location /expense-api/auth/ {
        limit_req zone=auth burst=10 nodelay;

        rewrite ^/expense-api/(.*)$ /$1 break;
        proxy_pass http://expense_api;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version  1.1;
        proxy_set_header    Connection "";
        proxy_connect_timeout  60s;
        proxy_send_timeout     60s;
        proxy_read_timeout     60s;
    }

    # ── API REST — rate limit estándar ────────────────────────────────────────
    location /expense-api/ {
        limit_req zone=api burst=30 nodelay;

        rewrite ^/expense-api/(.*)$ /$1 break;
        proxy_pass http://expense_api;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version  1.1;
        proxy_set_header    Connection "";
        proxy_connect_timeout  60s;
        proxy_send_timeout     300s;
        proxy_read_timeout     300s;
        proxy_buffering        off;
        proxy_cache            off;
    }

    # ── Frontend React (SPA) — rate limit general ─────────────────────────────
    location /expense/ {
        limit_req zone=general burst=50 nodelay;

        proxy_pass http://expense_app/;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade    $http_upgrade;
        proxy_set_header    Connection "upgrade";
        proxy_connect_timeout  60s;
        proxy_send_timeout     60s;
        proxy_read_timeout     60s;
    }

    # ── Agente LLM / Next.js (10x-builders-web) ──────────────────────────────
    # Reenvía /agent y /agent/* a web:3000 conservando el path completo.
    # Si la app Next.js necesita estar consciente del prefijo /agent,
    # configura basePath: '/agent' en next.config.js del proyecto 10x-builders.
    location /agent {
        limit_req zone=general burst=50 nodelay;

        proxy_pass http://10x_builders_web;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade    $http_upgrade;
        proxy_set_header    Connection "upgrade";
        proxy_connect_timeout  60s;
        proxy_send_timeout     300s;
        proxy_read_timeout     300s;
        proxy_buffering        off;
        proxy_cache            off;
    }

    # ── Raíz del servidor en :3000 — redirect a /expense/ ────────────────────
    location = / {
        return 301 /expense/;
    }
}
