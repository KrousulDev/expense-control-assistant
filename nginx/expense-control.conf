# ── Expense Control Assistant — nginx include ──────────────────────────────────
#
# Este archivo se copia al servidor en:
#   /etc/nginx/conf.d/expense-control.conf
# (dentro del contenedor 10x-builders-nginx)
#
# Para activarlo, agrega UNA línea al final del bloque http {} en nginx.conf:
#   include /etc/nginx/conf.d/*.conf;
#
# Las zonas de rate limit (general, api, auth) ya están definidas en nginx.conf.
# Este archivo las reutiliza sin redefinirlas.
#
# Upstreams:
#   expense-app  → contenedor nginx:alpine sirviendo el build de React (:80)
#   expense-api  → contenedor NestJS (:3000)
# Ambos deben estar en la red Docker expense_network, a la que también
# debe pertenecer el contenedor 10x-builders-nginx.
# ──────────────────────────────────────────────────────────────────────────────

upstream expense_app {
    server expense-app:80;
    keepalive 16;
}

upstream expense_api {
    server expense-api:3000;
    keepalive 16;
}

# ── Servidor Expense Control — Puerto 3000 ─────────────────────────────────────
# Todo el tráfico de la app entra por :3000 y se enruta por context path.
server {
    listen 3000;
    server_name _;

    # Heredar cabeceras de seguridad del servidor principal
    add_header X-Content-Type-Options  "nosniff"                          always;
    add_header X-Frame-Options         "DENY"                             always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin"  always;
    add_header Permissions-Policy      "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' http://192.168.1.212:3000; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

    # ── Auth — rate limit muy estricto ───────────────────────────────────────
    location /expense-api/auth/ {
        limit_req zone=auth burst=10 nodelay;

        # nginx strip /expense-api y reenvía el resto a NestJS
        rewrite ^/expense-api/(.*)$ /$1 break;
        proxy_pass http://expense_api;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version  1.1;
        proxy_set_header    Connection "";
        proxy_connect_timeout  60s;
        proxy_send_timeout     60s;
        proxy_read_timeout     60s;
    }

    # ── API REST — rate limit estándar ────────────────────────────────────────
    location /expense-api/ {
        limit_req zone=api burst=30 nodelay;

        rewrite ^/expense-api/(.*)$ /$1 break;
        proxy_pass http://expense_api;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version  1.1;
        proxy_set_header    Connection "";
        # Timeout generoso para respuestas de IA / streaming
        proxy_connect_timeout  60s;
        proxy_send_timeout     300s;
        proxy_read_timeout     300s;
        proxy_buffering        off;
        proxy_cache            off;
    }

    # ── Assets estáticos del frontend — caché larga ───────────────────────────
    location /expense/assets/ {
        limit_except GET HEAD { deny all; }

        proxy_pass http://expense_app;
        proxy_set_header Host $host;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── Frontend React (SPA) — rate limit general ─────────────────────────────
    location /expense/ {
        limit_req zone=general burst=50 nodelay;

        proxy_pass http://expense_app/;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade    $http_upgrade;
        proxy_set_header    Connection "upgrade";
        proxy_connect_timeout  60s;
        proxy_send_timeout     60s;
        proxy_read_timeout     60s;
    }

    # ── Raíz del servidor en :3000 — redirect a /expense/ ────────────────────
    location = / {
        return 301 /expense/;
    }
}
