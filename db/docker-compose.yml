# Standalone PostgreSQL — ideal para ciclos de reset de BD sin afectar app/api.
# Uso: docker compose -f db/docker-compose.yml up -d
# Reset: docker compose -f db/docker-compose.yml down -v && docker compose -f db/docker-compose.yml up -d

services:
  expense-db:
    image: postgres:17
    container_name: expense_control_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: expense_control
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - expense_db_data:/var/lib/postgresql/data
      - ../db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d expense_control']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - expense_network

volumes:
  expense_db_data:
    name: expense_db_data

networks:
  expense_network:
    name: expense_network
    external: true
